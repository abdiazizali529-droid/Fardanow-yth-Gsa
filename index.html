<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A United Fardanow Family - Registration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui,Inter,Arial}
  body{margin:0;background:#0a0a0a;display:flex;justify-content:center;padding:16px;color:#fff}
  .page{width:100%;max-width:560px}
  .top{background:#111;border:1px solid #222;border-radius:24px;padding:24px;text-align:center}
  .top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px}
  .top h1 b{color:#D4AF37}
  .top p{margin:6px 0 0;color:#888;font-size:12px;letter-spacing:1px}
  .card{background:#fff;color:#111;border-radius:22px;padding:22px;margin-top:14px}
  label{font-size:11px;font-weight:800;color:#666;text-transform:uppercase}
  input{width:100%;padding:14px 16px;border:1.5px solid #e5e7eb;background:#f9fafb;border-radius:12px;font-size:16px;margin:8px 0 14px;outline:none}
  input:focus{background:#fff;border-color:#000}
  .btn{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
  .btn-excel{width:100%;padding:14px;background:#107C41;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;display:flex;justify-content:center;gap:8px;margin-top:10px}
  .ok{display:none;background:#dcfce7;color:#166534;padding:10px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  th{text-align:left;color:#999;font-size:10px;text-transform:uppercase;padding:10px 4px;border-bottom:1px solid #eee}
  td{padding:10px 4px;border-bottom:1px solid #f5f5f5}
  .search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;font-size:13px;outline:none;margin-bottom:8px}
  .sort-row{display:flex;gap:8px;margin-bottom:10px}
  .sort-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;font-weight:800;font-size:12px;cursor:pointer}
  .sort-btn.active{background:#111;color:#fff;border-color:#111}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>A UNITED <b>FARDANOW FAMILY</b></h1>
    <p>REGISTRATION PORTAL</p>
  </div>

  <div class="card">
    <label>Full Names</label>
    <input id="names" placeholder="e.g. Ahmed Fardanow">
    <label>Location</label>
    <input id="location" placeholder="e.g. Nairobi, Eastleigh">
    <button class="btn" onclick="register()">REGISTER</button>
    <button class="btn-excel" onclick="exportExcel()">⬇ EXPORT TO EXCEL (.xlsx)</button>
    <div id="ok" class="ok">✓ Registered</div>
  </div>

  <div class="card">
    <input id="q" class="search" placeholder="Search...">
    <div class="sort-row">
      <button id="btn-az" class="sort-btn active" onclick="setSort('az')">Sort A-Z</button>
      <button id="btn-za" class="sort-btn" onclick="setSort('za')">Sort Z-A</button>
      <button id="btn-new" class="sort-btn" onclick="setSort('new')">Newest</button>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#888"><b>Members: <span id="count">0</span></b><span onclick="clearAll()" style="text-decoration:underline;cursor:pointer">Clear</span></div>
    <table><thead><tr><th>#</th><th>Names</th><th>Location</th></tr></thead><tbody id="tb"></tbody></table>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('fardanow_excel')||'[]');
const tb=document.getElementById('tb'), count=document.getElementById('count'), q=document.getElementById('q'), ok=document.getElementById('ok');
let sortMode = 'az'; // default A-Z

function setSort(mode){
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  if(mode==='az') document.getElementById('btn-az').classList.add('active');
  if(mode==='za') document.getElementById('btn-za').classList.add('active');
  if(mode==='new') document.getElementById('btn-new').classList.add('active');
  render();
}

function render(){
  let f = data.filter(d => (d.names+d.location).toLowerCase().includes(q.value.toLowerCase()));
  
  // SORT LOGIC
  if(sortMode === 'az'){
    f.sort((a,b) => a.names.trim().localeCompare(b.names.trim()));
  } else if(sortMode === 'za'){
    f.sort((a,b) => b.names.trim().localeCompare(a.names.trim()));
  }
  // if 'new', keep original order (newest first because we unshift)

  count.textContent = data.length;
  tb.innerHTML
